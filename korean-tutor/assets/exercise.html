<title>Корейский тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;600&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: one 720px workbook column under a sticky progress bar; one task card at a time;
   Korean answers are echoed into 원고지-style grid cells so blocks and spacing are visible. */
:root {
  --paper: #F8F9F6; --wash: #EEF1EC; --ink: #1E2421; --ink-soft: #59625C;
  --line: #D5DBD3; --cell: #B9CDBE;
  --accent: #2D4A80; --accent-ink: #FFFFFF; --accent-soft: #E3E9F4;
  --ok: #2E6A45; --ok-bg: #E4F1E7; --bad: #A33F28; --bad-bg: #F9EAE4; --warn: #775A1C; --warn-bg: #F6EEDA;
  --font-ko: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141816; --wash: #1B201D; --ink: #E4E8E3; --ink-soft: #A0A9A2;
    --line: #313833; --cell: #3D5244;
    --accent: #9DB4E3; --accent-ink: #10182A; --accent-soft: #212C42;
    --ok: #86C79C; --ok-bg: #18291E; --bad: #F09A83; --bad-bg: #331D17; --warn: #E2C27A; --warn-bg: #2C2414;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141816; --wash: #1B201D; --ink: #E4E8E3; --ink-soft: #A0A9A2;
  --line: #313833; --cell: #3D5244;
  --accent: #9DB4E3; --accent-ink: #10182A; --accent-soft: #212C42;
  --ok: #86C79C; --ok-bg: #18291E; --bad: #F09A83; --bad-bg: #331D17; --warn: #E2C27A; --warn-bg: #2C2414;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--font-ui); -webkit-text-size-adjust: 100%; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 720px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.bar h1 { font-size: 15px; font-weight: 600; margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 2px 7px; margin-right: 8px; font-weight: 600; vertical-align: 1px; }
.meta { font: 500 14px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
.fill { height: 3px; background: var(--accent); width: 0; transition: width .2s; }
main { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 56px; display: grid; gap: 20px; }
h2 { font-size: 24px; line-height: 1.25; margin: 0; text-wrap: balance; }
p { margin: 0; max-width: 64ch; }
.soft { color: var(--ink-soft); }
.stack { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--wash); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.exhibit { font: 400 26px/1.5 var(--font-ko); word-break: keep-all; overflow-wrap: anywhere; }
.ko-chip { font-family: var(--font-ko); background: var(--accent-soft); border-radius: 4px; padding: 0 4px; }
.gap { display: inline-block; min-width: 2.4em; border-bottom: 2px solid var(--accent); margin: 0 .15em; color: transparent; line-height: 1.1; }
.cpw { display: flex; gap: 6px; align-items: flex-start; min-width: 0; }
.cpw > :first-child { flex: 1 1 auto; min-width: 0; }
.cp { flex: none; width: 32px; height: 32px; padding: 0; display: grid; place-items: center; border-color: transparent; background: transparent; color: var(--ink-soft); }
.cp:hover { border-color: var(--line); color: var(--accent); }
.cp svg { width: 16px; height: 16px; }
.cp .ck, .cp.done .cc { display: none; }
.cp.done .ck { display: block; }
.cp.done { color: var(--ok); }
.transcript { font: 20px/1.5 var(--font-ko); }
.situation { border-left: 3px solid var(--accent); padding-left: 12px; display: grid; gap: 2px; }
button { font: inherit; cursor: pointer; border-radius: var(--r); border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 10px 16px; }
button:disabled { opacity: .45; cursor: default; }
.opt:disabled, .chunk:disabled { opacity: 1; }
.link { justify-self: start; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.armed { background: var(--bad); border-color: var(--bad); color: var(--paper); }
button.link { border: 0; background: none; padding: 4px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], textarea, select { font: inherit; color: var(--ink); background: var(--paper); caret-color: var(--accent); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; width: 100%; }
input:disabled, textarea:disabled { opacity: .75; }
.ko-in { font: 22px/1.4 var(--font-ko); }
select { width: auto; max-width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; }
.actions > div { display: flex; flex-wrap: wrap; gap: 10px; }
.opt { font: 22px/1.3 var(--font-ko); min-width: 4.5em; }
.opt[aria-checked=true] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.is-ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.opt.is-bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.radio { display: flex; gap: 10px; align-items: center; cursor: pointer; }
.radio input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.note { border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; border-left: 3px solid; }
.note.ok { background: var(--ok-bg); border-color: var(--ok); }
.note.bad { background: var(--bad-bg); border-color: var(--bad); }
.note.warn { background: var(--warn-bg); border-color: var(--warn); }
.verdict { font-weight: 600; }
.note.ok .verdict { color: var(--ok); }
.note.bad .verdict { color: var(--bad); }
.note.warn .verdict { color: var(--warn); }
.grid { display: flex; flex-wrap: wrap; gap: 6px; }
.cell { width: 40px; height: 40px; padding: 0; font: 500 14px var(--font-mono); border-radius: 6px; }
.cell.done { border-color: var(--ink-soft); }
.cell.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.cell.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.cell.cur { box-shadow: 0 0 0 2px var(--accent); }
.bank, .line { display: flex; flex-wrap: wrap; gap: 8px; min-height: 56px; padding: 8px; border-radius: var(--r); }
.line { border: 1px dashed var(--cell); background: var(--paper); }
.chunk { font: 20px/1.3 var(--font-ko); padding: 8px 12px; }
.wg { display: flex; flex-wrap: wrap; border-top: 1px solid var(--cell); border-left: 1px solid var(--cell); width: max-content; max-width: 100%; }
.wc { width: 34px; height: 34px; display: grid; place-items: center; border-right: 1px solid var(--cell); border-bottom: 1px solid var(--cell); font: 20px var(--font-ko); background: var(--paper); }
.parts { font: 15px var(--font-ko); color: var(--ink-soft); min-height: 1.4em; }
.kbd { display: grid; gap: 6px; user-select: none; -webkit-user-select: none; }
.krow { display: flex; gap: 5px; justify-content: center; }
.key { flex: 1 1 0; max-width: 54px; min-width: 0; padding: 10px 0; font: 18px var(--font-ko); }
.key.wide { max-width: 128px; flex-grow: 2; font: 14px var(--font-ui); }
.key.space { max-width: 280px; flex-grow: 6; }
.key.on { background: var(--accent-soft); border-color: var(--accent); }
textarea.result { font: 13px/1.5 var(--font-mono); min-height: 200px; white-space: pre; overflow: auto; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
@media (max-width: 480px) {
  .exhibit { font-size: 22px; }
  .key { font-size: 16px; padding: 9px 0; }
  .card { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>

<header class="bar">
  <div class="bar-in">
    <h1><span class="badge" id="badge"></span><span id="set-title"></span></h1>
    <span class="meta" id="meta"></span>
  </div>
  <div class="fill" id="fill"></div>
</header>

<main>
  <div class="note warn" id="banner" hidden></div>

  <section class="stack" id="intro">
    <h2 id="intro-title"></h2>
    <p id="intro-text"></p>
    <p class="soft" id="intro-mode"></p>
    <div class="row" id="voice-row" hidden>
      <label for="voice-select" id="voice-label"></label>
      <select id="voice-select"></select>
      <button type="button" id="voice-test"></button>
    </div>
    <div class="row"><button type="button" class="primary" id="start"></button></div>
  </section>

  <section class="card" id="card" hidden aria-live="polite"></section>

  <section class="stack" id="kbd-wrap" hidden>
    <div class="row">
      <label class="radio"><input type="checkbox" id="kbd-toggle"><span id="kbd-label"></span></label>
      <span class="soft" id="kbd-hint"></span>
    </div>
    <div class="kbd" id="kbd" hidden></div>
  </section>

  <nav class="stack" id="nav" hidden>
    <div class="grid" id="grid"></div>
  </nav>

  <section class="stack" id="done" hidden>
    <h2 id="done-title"></h2>
    <p id="done-note"></p>
    <textarea class="result" id="result" readonly spellcheck="false"></textarea>
    <div class="row"><button type="button" class="primary" id="copy"></button><span class="soft" id="copy-status" role="status"></span></div>
    <div class="stack" id="cards-wrap">
      <h2 id="cards-title"></h2>
      <p class="soft" id="cards-note"></p>
      <textarea class="result" id="cards" readonly spellcheck="false"></textarea>
      <div class="row"><button type="button" id="cards-copy"></button><span class="soft" id="cards-status" role="status"></span></div>
    </div>
  </section>

  <div class="foot" id="foot" hidden>
    <button type="button" id="finish"></button>
    <button type="button" class="link" id="reset"></button>
  </div>
</main>

<script type="application/json" id="kt-data">/*KT-DATA*/</script>

  function plural(n, one, few, many) {
    var a = n % 10, b = n % 100;
    return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many;
  }
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  // Metalanguage text; `backticks` mark Korean fragments.
  function rich(node, s) {
    String(s).split("`").forEach(function (part, i) {
      if (!part) return;

    });
    return node;
  }
  // Korean exhibit; ___ marks the gap.
  function exhibit(s) {
    var d = el("div", "exhibit"); d.lang = "ko";
    String(s).split("___").forEach(function (part, i) { if (i) d.append(el("span", "gap", "___")); if (part) d.append(part); });
    return d;
  }

  // ---- copying: every piece of material can go to a flashcard app

  var ICON = '<svg class="cc" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.5"/><path d="M10.5 5.5V3.5a1.5 1.5 0 0 0-1.5-1.5H3.5A1.5 1.5 0 0 0 2 3.5V9a1.5 1.5 0 0 0 1.5 1.5h2"/></svg>' +

  // Clipboard API first; then execCommand; then select the text so the viewer can press the shortcut.
  function copyText(text, node, cb) {
    function fallback() {
      var ta = el("textarea"); ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.append(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }

        if (node.select) { node.focus(); node.select(); }

    node.textContent = ok ? okText : T.copyFail;
    setTimeout(function () { node.textContent = idleText; }, ok ? 1200 : 4000);

    var w = el("div", "cpw"), b = el("button", "cp"); b.type = "button";
    b.innerHTML = ICON; b.setAttribute("aria-label", T.copyEl); b.title = T.copyEl;

        b.classList.toggle("done", ok); b.title = ok ? T.copied : T.copyFail;
        setTimeout(function () { b.classList.remove("done"); b.title = T.copyEl; }, 1200);
      });
    });
    w.append(node, b); return w;
  }

  var D;
  try { D = JSON.parse($("kt-data").textContent); } catch (e) { D = null; }
  if (!D || !D.items || !D.items.length) {
    var b0 = $("banner"); b0.textContent = STR.ru.noData; b0.hidden = false; $("intro").hidden = true; return;
  }
  var T = STR[D.lang] || STR.ru;
  var items = D.items;
  var drill = D.mode === "drill";
  var KEY = "kt:" + D.id;
  var hasAudio = items.some(function (q) { return q.type === "listen" || q.type === "dictation"; });
  var hasKo = items.some(function (q) { return q.type === "text" || q.type === "dictation" || q.type === "fix"; });
  document.documentElement.lang = D.lang || "ru";

  function fresh() {
    return { v: 1, started: false, finished: false, cur: 0, a: {}, chk: {}, h: {}, t: {}, plays: {}, reason: {}, elapsed: 0, voice: "", kbd: false, kbdUsed: false };
  }
  var S = fresh();

  // ---- persistence: every read and write guarded; the page works without storage
  var storageOk = (function () {
    try { localStorage.setItem("kt:probe", "1"); localStorage.removeItem("kt:probe"); return true; } catch (e) { return false; }
  })();

    try {
      var raw = localStorage.getItem(KEY);

  function mm(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

    if (drill && S.chk[q.id]) card.append(feedback(q));
    var acts = el("div", "actions"), left = el("div"), right = el("div");
    var prev = el("button", null, T.prev); prev.type = "button"; prev.disabled = S.cur === 0;
    prev.addEventListener("click", function () { go(S.cur - 1); });
    left.append(prev);
    if (drill && !locked) {
      var ck = el("button", "primary", T.check); ck.type = "button"; ck.id = "check-btn"; ck.disabled = !answered(q);
      ck.addEventListener("click", function () { check(q); });
      right.append(ck);
    }
    var nx = el("button", drill && !locked ? null : "primary", T.next); nx.type = "button"; nx.disabled = S.cur === items.length - 1;
    nx.addEventListener("click", function () { go(S.cur + 1); });
    right.append(nx);
    acts.append(left, right);
    card.append(acts);
    $("kbd-wrap").hidden = S.finished || locked || ["text", "dictation", "fix"].indexOf(q.type) < 0;
  }
  function renderAll() {
    var started = S.started;
    $("intro").hidden = started;
    $("card").hidden = !started;
    $("nav").hidden = !started;
    $("foot").hidden = !started;
    $("finish").hidden = S.finished;
    $("done").hidden = !S.finished;
    if (started) { renderCard(); renderGrid(); }
    if (S.finished) {
      $("result").value = resultText();
      $("cards").hidden = !drill; $("cards-copy").parentNode.hidden = !drill;
      $("cards-note").textContent = drill ? T.cardsNote : T.cardsProbe;
      if (drill) $("cards").value = items.map(cardLine).join("\n");
    }
    renderBar();
  }
  function go(i) {
    if (i < 0 || i >= items.length) return;
    S.cur = i; save(); renderAll();
    var f = document.querySelector("#card input.ko-in:not(:disabled)");
    if (f && !S.kbd) f.focus({ preventScroll: true });
  }
  function check(q) {
    if (!answered(q) || S.chk[q.id]) return;
    S.chk[q.id] = { ok: S.a[q.id] === "NOAUDIO" ? null : correct(q), hint: S.h[q.id] || 0 };
    save(); renderAll();
  }

  // ---- result block for the tutor
  function resultText() {
    var head = "KT-RESULT id=" + D.id + " mode=" + D.mode + " items=" + items.length +
      " time=" + Math.floor(S.elapsed / 60) + "m" + String(S.elapsed % 60).padStart(2, "0") + "s";
    if (hasAudio) head += " voice=" + (currentVoice() ? currentVoice().name.replace(/\s+/g, "_") : "none");
    if (S.kbdUsed) head += " keyboard=onscreen";
    var lines = [head];
    items.forEach(function (q) {
      var f = [q.id, q.type, shown(q)];
      if (drill) { var c = S.chk[q.id]; f.push(!c ? "unchecked" : c.ok === null ? "noaudio" : c.ok ? "ok" : "miss"); }
      if (S.h[q.id]) f.push("hint=" + S.h[q.id]);
      if (S.plays[q.id]) f.push("plays=" + S.plays[q.id]);
      f.push((S.t[q.id] || 0) + "s");
      if (S.reason[q.id] && S.reason[q.id].trim()) f.push("why: " + S.reason[q.id].replace(/\s+/g, " ").trim());
      lines.push(f.join(" | "));
    });
    return lines.join("\n");
  }
  function finish() {
    if (!S.started || S.finished) return;
    S.finished = true;
    try { speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    save(); renderAll();
    $("done").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  // ---- two-click arming: the viewer blocks confirm()
  function arm(btn, armedLabel, action) {
    var armed = false, timer = null;
    function disarm() { armed = false; btn.classList.remove("armed"); btn.textContent = btn.dataset.label; clearTimeout(timer); }
    btn.addEventListener("click", function () {
      if (armed) { disarm(); action(); return; }
      armed = true; btn.classList.add("armed"); btn.textContent = armedLabel();
      timer = setTimeout(disarm, 5000);
    });
  }

  // ---- wiring
  $("intro-title").textContent = D.title || "";
  $("intro-text").textContent = D.intro || "";
  $("intro-text").hidden = !D.intro;
  $("intro-mode").textContent = T.count(items.length) + ". " + (drill ? T.drillNote : T.probeNote);
  $("start").textContent = S.started ? T.resume : T.start;
  $("voice-label").textContent = T.voice;
  $("voice-test").textContent = T.test;
  $("voice-select").addEventListener("change", function (e) { S.voice = e.target.value; save(); });
  $("voice-test").addEventListener("click", function () { speak({ say: "안녕하세요. 한국어 연습을 시작합니다." }, false); });
  $("kbd-label").textContent = T.kbd;
  $("kbd-hint").textContent = T.kbdHint;
  $("kbd-toggle").checked = S.kbd;
  $("kbd").hidden = !S.kbd;
  $("kbd-toggle").addEventListener("change", function (e) {
    S.kbd = e.target.checked; $("kbd").hidden = !S.kbd; save(); renderCard();
  });
  $("done-title").textContent = T.doneTitle;
  $("done-note").textContent = T.doneNote;
  $("copy").textContent = T.copy;
  $("cards-title").textContent = T.cardsTitle;
  $("cards-copy").textContent = T.copy;
  $("cards-copy").addEventListener("click", function () {
    copyText($("cards").value, $("cards"), function (ok) { flash($("cards-status"), T.copied, "", ok); });
  });
  $("finish").textContent = T.finish; $("finish").dataset.label = T.finish;
  $("reset").textContent = T.reset; $("reset").dataset.label = T.reset;
  if (!hasKo) $("kbd-wrap").remove();
  buildKeyboard();

  $("start").addEventListener("click", function () { S.started = true; save(); renderAll(); go(S.cur); });
  arm($("finish"), function () {
    var n = items.filter(function (q) { return drill ? !S.chk[q.id] : !answered(q); }).length;
    return n ? (drill ? T.unchecked(n) : T.unanswered(n)) : T.finishAll;
  }, finish);
  arm($("reset"), function () { return T.resetSure; }, function () {
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
    var keepVoice = S.voice; S = fresh(); S.voice = keepVoice;
    $("start").textContent = T.start; $("kbd-toggle").checked = false; $("kbd").hidden = true;
    $("banner").hidden = true; renderAll(); window.scrollTo(0, 0);
  });
  $("copy").addEventListener("click", function () {
    copyText($("result").value, $("result"), function (ok) { flash($("copy-status"), T.copied, "", ok); });
  });

  setInterval(function () {
    if (!S.started || S.finished || document.hidden) return;
    S.elapsed += 1;
    var q = items[S.cur]; S.t[q.id] = (S.t[q.id] || 0) + 1;
    if (D.time_limit_min && S.elapsed >= D.time_limit_min * 60) { finish(); return; }
    renderBar(); save();
  }, 1000);

  var banner = $("banner");
  if (!storageOk) { banner.textContent = T.noStorage; banner.hidden = false; }
  else if (restored) { banner.textContent = T.restored; banner.hidden = false; }
  ready = true;
  renderAll();
})();
</script>
